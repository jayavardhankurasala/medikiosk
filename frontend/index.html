<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300C7A6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2v20M2 12h20'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#00C7A6" />
    <meta name="description" content="MediKiosk – AI Multimodal Clinical Intake Platform" />
    <title>MediKiosk – Your Health Story, Simplified</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #E8F7F5;
        color: #1F2937;
        overflow-x: hidden;
        user-select: none;
      }
      /* Prevent accidental pinch-zoom on kiosk touch screens */
      touch-action: pan-y;

      /* Smooth scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #00C7A6;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #E8F7F5;
      }

      /* Pulse animation for Bot & Mic */
      @keyframes pulseRing {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(0, 199, 166, 0.7);
        }
        70% {
          transform: scale(1.05);
          box-shadow: 0 0 0 18px rgba(0, 199, 166, 0);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(0, 199, 166, 0);
        }
      }

      @keyframes waveBar {
        0%, 100% { height: 8px; }
        50% { height: 28px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
