version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database Container
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: medikiosk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-medikiosk}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - medikiosk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MediKiosk Unified Production Application (Frontend + Backend + AI Service)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medikiosk-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@postgres:5432/${DB_NAME:-medikiosk}?schema=public
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-medikiosk_production_secret_change_in_prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      SMS_PROVIDER: ${SMS_PROVIDER:-MOCK}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY}
      UPLOAD_DIR: ./uploads
    ports:
      - "5000:5000"
    volumes:
      - medikiosk_uploads:/app/backend/uploads

volumes:
  medikiosk_pgdata:
    driver: local
  medikiosk_uploads:
    driver: local
